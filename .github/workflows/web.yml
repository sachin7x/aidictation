name: Web

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/contracts/**"
  push:
    branches: ["main","feat/**"]
    paths:
      - "web/**"
      - "packages/contracts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
